            gold: {
              300: '#ECC870',
              400: '#DEB24A',
              500: '#D4AF37',
              600: '#B89228',
              champagne: '#ECC870',
              metallic: '#C5A059'
            },
            ivory: '#FDFBF7'

<body class="bg-[#080706] text-[#FDFBF7] selection:bg-[#D4AF37]/30 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Laurel Wreath SVG Icon
    function LaurelIcon({ className = "w-4 h-4 text-[#ECC870]" }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M12 21c-4.97 0-9-4.03-9-9 0-3.5 2-6.5 5-8" />
          <path d="M12 21c4.97 0 9-4.03 9-9 0-3.5-2-6.5-5-8" />
          <path d="M6 8a3 3 0 0 1 3 3" />
          <path d="M18 8a3 3 0 0 0-3 3" />
          <path d="M5 13a3 3 0 0 1 3 3" />
          <path d="M19 13a3 3 0 0 0-3 3" />
          <circle cx="12" cy="5" r="1.5" fill="currentColor" />
        </svg>
      );
    }

    function App() {
      const [bookingOpen, setBookingOpen] = useState(false);
      const [customMenuOpen, setCustomMenuOpen] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [aboutOpen, setAboutOpen] = useState(false);
      const [galleryOpen, setGalleryOpen] = useState(false);
      const [contactOpen, setContactOpen] = useState(false);
      const [servicesDropdown, setServicesDropdown] = useState(false);
      const [mobileMenu, setMobileMenu] = useState(false);
      const [toast, setToast] = useState(null);

      // Custom Menu State
      const [selectedDishes, setSelectedDishes] = useState([
        'Zafrani Mutton Dum Biryani',
        'Mirchi Ka Salan & Dahi Ki Chutney',
        'Shahi Double Ka Meetha'
      ]);

      const [bookingData, setBookingData] = useState({
        name: '',
        phone: '',
        eventType: 'Royal Wedding Banquet',
        date: '',
        guests: '300 - 600 Guests',
        notes: ''
      });

      const dishesList = [
        'Zafrani Mutton Dum Biryani',
        'Special Chicken Dum Biryani',
        'Mutton Seekh Kebab',
        'Chicken Majestic Flambé',
        'Paneer Malai Tikka',
        'Crispy Chilli Corn',
        'Dum Ka Murgh Hyderabadi',
        'Mutton Rogan Josh Kashmiri',
        'Butter Chicken Delicacy',
        'Paneer Butter Masala',
        'Rumali Roti & Butter Naan',
        'Mirchi Ka Salan & Dahi Ki Chutney',
        'Shahi Double Ka Meetha',
        'Qubani Ka Meetha with Cream',
        'Hot Gulab Jamun with Rabdi',
        'Shahi Zafrani Sharbat'
      ];

      const toggleDish = (dish) => {
        if (selectedDishes.includes(dish)) {
          setSelectedDishes(selectedDishes.filter(d => d !== dish));
        } else {
          setSelectedDishes([...selectedDishes, dish]);
        }
      };

      const handleBookingSubmit = (e) => {
        e.preventDefault();
        if (!bookingData.name || !bookingData.phone) return;
        const msg = `Hello Nashwan Catering,%0A%0AEvent Booking Request:%0A• Name: ${encodeURIComponent(bookingData.name)}%0A• Phone: ${encodeURIComponent(bookingData.phone)}%0A• Event: ${encodeURIComponent(bookingData.eventType)}%0A• Date: ${encodeURIComponent(bookingData.date || 'TBD')}%0A• Guests: ${encodeURIComponent(bookingData.guests)}%0A• Notes: ${encodeURIComponent(bookingData.notes || 'None')}`;
        setBookingOpen(false);
        setToast({ title: 'Request Sent', message: `Thank you ${bookingData.name}! Our banquet manager will reach out promptly.` });
        window.open(`https://wa.me/919492247495?text=${msg}`, '_blank');
      };

      const handleCustomMenuSubmit = () => {
        const text = `Hello Nashwan Catering,%0A%0AI would like a quotation for my custom menu (%2A${selectedDishes.length} items%2A):%0A%0A${selectedDishes.map((d, i) => `${i + 1}. ${encodeURIComponent(d)}`).join('%0A')}`;
        setCustomMenuOpen(false);
        window.open(`https://wa.me/919492247495?text=${text}`, '_blank');
      };

      return (
        <div className="min-h-screen bg-[#080706] text-[#FDFBF7] flex flex-col relative selection:bg-[#D4AF37]/30">

                    <img 
                      src="assets/logo.png" 
                      alt="Nashwan Catering Services" 
                      className="h-12 sm:h-14 md:h-16 w-auto object-contain transition-transform duration-300 group-hover:scale-105 drop-shadow-[0_2px_12px_rgba(212,175,55,0.25)]"

                        <span className="text-[#D4AF37]/60">•</span>

                  <button onClick={() => setAboutOpen(true)} className="px-3.5 py-2 text-sm font-medium text-[#E5E5E5] hover:text-[#ECC870] transition-colors">
                    About

                  <div className="relative" onMouseEnter={() => setServicesDropdown(true)} onMouseLeave={() => setServicesDropdown(false)}>
                    <button className="px-3.5 py-2 text-sm font-medium text-[#E5E5E5] hover:text-[#ECC870] transition-colors flex items-center gap-1.5">
                      Services
                      <svg className="w-3.5 h-3.5 text-[#D4AF37]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>

                          <span className="text-[10px] uppercase tracking-widest text-[#ECC870] font-semibold">Specialized Offerings</span>
                        </div>
                        <button onClick={() => { setServicesDropdown(false); setBookingOpen(true); }} className="w-full text-left px-3.5 py-2 hover:bg-[#D4AF37]/15 block">

                        <button onClick={() => { setServicesDropdown(false); setBookingOpen(true); }} className="w-full text-left px-3.5 py-2 hover:bg-[#D4AF37]/15 block">
                          <div className="text-xs font-semibold text-white">Corporate Galas & Summits</div>
                          <div className="text-[10px] text-neutral-400">Multi-cuisine buffets & executive protocol</div>
                        </button>
                        <button onClick={() => { setServicesDropdown(false); setBookingOpen(true); }} className="w-full text-left px-3.5 py-2 hover:bg-[#D4AF37]/15 block">
                          <div className="text-xs font-semibold text-white">Traditional Feasts & Dastarkhwan</div>
                          <div className="text-[10px] text-neutral-400">Authentic regional recipes & live stations</div>
                        </button>
                      </div>
                    )}
                  </div>

                  <button onClick={() => setMenuOpen(true)} className="px-3.5 py-2 text-sm font-medium text-[#E5E5E5] hover:text-[#ECC870] transition-colors">

                  <button onClick={() => setCustomMenuOpen(true)} className="px-3.5 py-2 text-sm font-medium text-[#E5E5E5] hover:text-[#ECC870] transition-colors">
                    Custom Menu
                  </button>
                  <button onClick={() => setGalleryOpen(true)} className="px-3.5 py-2 text-sm font-medium text-[#E5E5E5] hover:text-[#ECC870] transition-colors">

                    Contact
                  </button>
                </nav>

                {/* Right: Book Now */}

                  <button 
                    onClick={() => setBookingOpen(true)}
                    className="relative inline-flex items-center justify-center gap-2 px-5 sm:px-6 py-2.5 sm:py-3 rounded-full text-xs sm:text-sm font-semibold tracking-wider uppercase text-black bg-gradient-to-r from-[#ECC870] via-[#D4AF37] to-[#B89228] shadow-[0_4px_20px_rgba(212,175,55,0.35)] hover:shadow-[0_6px_25px_rgba(212,175,55,0.55)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300"
                  >
                    <svg className="w-4 h-4 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span>Book Now</span>
                  </button>

                  <button onClick={() => setMobileMenu(!mobileMenu)} className="p-2 rounded-lg border border-[#D4AF37]/40 text-[#ECC870] lg:hidden">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
                  </button>
                </div>

              </div>
            </div>
          </header>

          {/* Hero Section */}
          <section className="relative min-h-screen w-full flex flex-col justify-between overflow-hidden bg-[#080706]">
            
            {/* Background Image Container */}
            <div 
              className="absolute inset-0 bg-cover bg-no-repeat bg-right lg:bg-[center_right] z-0"
              style={{ 
                backgroundImage: "url('assets/hero-bg.jpg')",
                backgroundPosition: 'right 30% center'
              }}
            >
              {/* Left-to-Right Dark Overlay */}
              <div className="absolute inset-0 bg-gradient-to-r from-[#070605] via-[#080706]/92 sm:via-[#080706]/85 md:via-[#080706]/70 to-transparent lg:w-[75%]" />
              <div className="absolute inset-0 bg-gradient-to-t from-[#080706] via-transparent to-black/60" />
            </div>

            {/* Main Content Area */}
            <div className="relative z-10 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-28 sm:pt-32 md:pt-36 lg:pt-40 pb-8 flex-1 flex flex-col justify-between">
              
              <div className="max-w-2xl lg:max-w-3xl">
                
                {/* Eyebrow */}
                <div className="inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full border border-[#D4AF37]/35 bg-[#D4AF37]/10 backdrop-blur-sm mb-4 sm:mb-6">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#ECC870] animate-pulse" />
                  <span className="text-[10px] sm:text-xs font-semibold tracking-widest uppercase text-[#ECC870]">
                    PREMIUM CATERING SERVICES
                  </span>
                </div>

                {/* Main Heading */}
                <h1 className="font-serif text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-bold tracking-tight leading-[1.05] mb-5 sm:mb-6 drop-shadow-lg">
                  <span className="text-[#FDFBF7] block">Nashwan</span>
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#FFF5CE] via-[#ECC870] to-[#C5A059] block">
                    Catering
                  </span>
                </h1>

                {/* Description */}
                <p className="text-neutral-200/90 text-base sm:text-lg md:text-xl font-normal leading-relaxed max-w-xl mb-7 sm:mb-8 font-sans">
                  Delicious food, elegant presentation, and seamless service for every celebration.
                </p>

                {/* CTA Buttons */}
                <div className="flex flex-wrap items-center gap-4 sm:gap-5 mb-8 sm:mb-10">
                  <button 
                    onClick={() => setBookingOpen(true)}
                    className="group relative inline-flex items-center justify-center gap-3 px-7 sm:px-8 py-3.5 sm:py-4 rounded-full text-xs sm:text-sm font-semibold tracking-wider uppercase text-black bg-gradient-to-r from-[#ECC870] via-[#D4AF37] to-[#B89228] shadow-[0_4px_25px_rgba(212,175,55,0.4)] hover:shadow-[0_8px_35px_rgba(212,175,55,0.6)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300"
                  >
                    <span>Book Your Event</span>
                    <svg className="w-4 h-4 text-black group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                  </button>

                  <button 
                    onClick={() => setCustomMenuOpen(true)}
                    className="group inline-flex items-center justify-center gap-3 px-6 sm:px-7 py-3.5 sm:py-4 rounded-full text-xs sm:text-sm font-medium tracking-wide text-[#FDFBF7] bg-[#0C0B0A]/60 hover:bg-[#D4AF37]/15 border border-[#ECC870]/70 hover:border-[#ECC870] backdrop-blur-md transition-all duration-300"
                  >
                    <div className="w-5 h-5 rounded-full border border-[#ECC870] flex items-center justify-center text-[#ECC870]">
                      <svg className="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                    </div>
                    <span>Custom Menu</span>
                  </button>
                </div>

                {/* Service Highlights */}
                <div className="w-full max-w-2xl py-4 sm:py-6 border-y border-[#D4AF37]/25 backdrop-blur-[2px] mb-8">
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-2 items-center">
                    
                    <div onClick={() => setBookingOpen(true)} className="group flex flex-col sm:items-center text-left sm:text-center p-2 rounded-lg hover:bg-white/[0.03] transition-all cursor-pointer">
                      <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-full border border-[#D4AF37]/60 flex items-center justify-center text-[#ECC870] group-hover:scale-110 mb-2 sm:mb-2.5">
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                      </div>
                      <h4 className="text-xs sm:text-sm font-serif font-medium text-[#FDFBF7] tracking-wide group-hover:text-[#ECC870]">Events & Celebrations</h4>
                    </div>

                    <div className="hidden sm:block h-10 w-[1px] bg-gradient-to-b from-transparent via-[#D4AF37]/50 to-transparent self-center -mx-1" />

                    <div onClick={() => setCustomMenuOpen(true)} className="group flex flex-col sm:items-center text-left sm:text-center p-2 rounded-lg hover:bg-white/[0.03] transition-all cursor-pointer">
                      <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-full border border-[#D4AF37]/60 flex items-center justify-center text-[#ECC870] group-hover:scale-110 mb-2 sm:mb-2.5">

                      <h4 className="text-xs sm:text-sm font-serif font-medium text-[#FDFBF7] tracking-wide group-hover:text-[#ECC870]">Customized Menus</h4>
                    </div>

                    <div className="hidden sm:block h-10 w-[1px] bg-gradient-to-b from-transparent via-[#D4AF37]/50 to-transparent self-center -mx-1" />

                    <div onClick={() => setAboutOpen(true)} className="group flex flex-col sm:items-center text-left sm:text-center p-2 rounded-lg hover:bg-white/[0.03] transition-all cursor-pointer">

                    </div>

                    <div>

                        value={bookingData.guests} onChange={(e) => setBookingData({...bookingData, guests: e.target.value})}

                      >
                        <option>100 - 300 Guests</option>
                        <option>300 - 600 Guests</option>
                        <option>600 - 1200 Guests</option>
                        <option>1200+ Guests</option>

                    return (
                      <button key={i} onClick={() => toggleDish(dish)} className={`p-2.5 rounded-lg border text-left text-xs flex justify-between items-center ${sel ? 'bg-[#D4AF37]/20 border-[#ECC870] text-white' : 'bg-[#14120F] border-white/5 text-neutral-300'}`}>

                  <div className="p-4 bg-[#14120F] border border-[#D4AF37]/25 rounded-xl">

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
